name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        version: "0.12.1"
    - name: Build and publish
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYNITE }}
      run: |
        uv build --no-sources
        uv publish
