name: build & test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    steps:
    - uses: actions/checkout@v7

    - name: Install uv and set up Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        python-version: ${{ matrix.python-version }}
        version: "0.12.1"
        enable-cache: true

    - name: Install the project
      run: uv sync --locked --extra all --dev

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run --locked flake8 . --exclude=.venv --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run --locked flake8 . --exclude=.venv --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        xvfb-run -a uv run --locked coverage run --source=Pynite -m pytest

    - name: Convert coverage to XML
      run: |
        uv run --locked coverage xml -o .coverage.xml

    - name: Build distributions
      run: uv build --no-sources

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        file: .coverage.xml
        flags: unittests
        name: codecov-coverage
        token: ${{ secrets.CODECOV_TOKEN }}
